services:
  postgres:
    image: postgres:16-alpine
    container_name: nexus-crm-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: nexus
      POSTGRES_PASSWORD: nexus_dev_pw
      POSTGRES_DB: nexus_crm
    ports:
      - "5432:5432"
    volumes:
      - nexus_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexus -d nexus_crm"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  nexus_pg_data:
